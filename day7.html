<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Properties Example</title>
  <style>
    .block {
      display: block;
      background-color: #0a0888;
      padding: 10px;
      border: 1px solid #ccc;
    }
    .inline {
      display: inline;
      background-color: #25e7d7;
      padding: 10px;
      border: 1px solid #cccccc;
    }
    .inline-block {
      display: inline-block;
      background-color: #b6ee4f;
      padding: 10px;
      border: 1px solid #ccc;
      width: 200px;
    }
    .none {
      display: none;
    }
  </style>
</head>
<body>
  <div class="block">Block element</div>
  <div class="inline">Inline element</div>
  <div class="inline">Another inline element</div>
  <div class="inline-block">Inline-block element</div>
  <div class="none">This element is not displayed</div>
</body>
</html>
