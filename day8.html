<!DOCTYPE html>
 <html lang="en"> 
    <head> <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Grid</title> 
        <h1>Grid example</h1><link rel="stylesheet" href="style.css"> 
    </head> 
    <body> 
        <div class="container"> 
            <div>1</div> <div>2</div> <div>3</div> <div>4</div> </div> 
        </body> 
        <style>
        .container{ 
            display: grid; 
            grid-template-columns: repeat(4, 100px);/same size/ gap: 10px; } 
        .container div{
             background-color: blueviolet; padding: 20px; }
             </style>
             </html>
