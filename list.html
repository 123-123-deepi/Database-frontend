<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      color: #00698f;
    }
    ol, ul { margin-left: 20px;
    }
    li {
      margin-bottom: 10px;
    }
    .ordered-list {
      list-style: decimal;
      padding: 0;
    }
    .unordered-list {
      list-style: disc;
      padding: 0;}
   
  </style>
</head>
<body>
  <h2>Ordered List (Top 5 Programming Languages)</h2>
  <ol class="ordered-list">
    <li>JavaScript</li>
    <li>Python</li>   <li>Java</li>
    <li>C++</li>
    <li>C#</li>
  </ol>

  <h2>Unordered List (Popular Web Technologies)</h2>
  <ul class="unordered-list">
    <li>HTML5</li>
    <li>CSS3</li>
    <li>React.js</li>
    <li>Angular.js</li>
    <li>Node.js</li>
  </ul>
</body>
</html>
