
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Bar Example</title>
  <h1>DD foundation</h1>
  <style>
    body {
      font-family: Arial, sans-serif;
       background-image: /home/karthick/Downloads/baby2.jpg;
      margin: 0;
      padding: 0;
    }
    .menu-bar {
      background-color: #333;
      color: #fff;
      padding: 1em;
      text-align: center;
    }
    .menu-bar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .menu-bar li {
      display: inline-block;
      margin-right: 20px;
    }
    .menu-bar a {
      color: #fff;
      text-decoration: none;
    }
    .menu-bar a:hover {
      color: #ccc;
    }
    .content {
      padding: 20px;
    }
    #address, #contact, #content {
      display: none;
    }
      padding: 1em;
    #home {
      display: block;
    }
  </style>
</head>
<body>
  <div class="menu-bar">
    <ul>
      <li><a href="#home" onclick="showContent('home')">Home</a></li>
      <li><a href="#address" onclick="showContent('address')">Address</a></li>
      <li><a href="#contact" onclick="showContent('contact')">Contact</a></li>
      <li><a href="#content" onclick="showContent('content')">Content</a></li>
    </ul>
  </div>
 

  

</body>
</html>
