<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
   
</head>
<body>
    <form>
        <fieldset>
            <legend>User Personal Information</legend>
            <label for="name">Enter your full name:</label><br>
            <input type="text" id="name" name="name" required /><br>
            <label for="email">Enter your email:</label><br>
            <input type="email" id="email" name="email" required /><br>
            <label for="password">Enter your password:</label><br>
            <input type="password" id="password" name="pass" required /><br>
            <label for="confirmPassword">Confirm your password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPass" required /><br>
            <label>Enter your gender:</label><br>
            <div class="gender-group">
                <input type="radio" name="gender" value="male" id="male" required />
                <label for="male">Male</label>
                <input type="radio" name="gender" value="female" id="female" />
                <label for="female">Female</label>
                <input type="radio" name="gender" value="others" id="others" />
                <label for="others">Others</label>
            </div>
            <label for="dob">Enter your Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required /><br>
            <label for="address">Enter your Address:</label><br>
            <textarea id="address" name="address" required></textarea><br>
            <input type="submit" value="Submit" /><br>
        </fieldset>
    </form>
</body>
</html>
