<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"content="width=device-width,initial-scale=1.0">
    <title>position property</title>
    <style>
        .parent{
            position: relative;
            width: 300px;
            height: 200px;
            background-color: yellow;}
        .child{
            position: absolute;
            width: 50px;
            height: 50px;
            background-color:rebeccapurple;
            top: 20px;
            center: 30px;
        

        }
        
    </style>
</head>
<body>
    <div class="parent">relative</div>
    <div class="child">absolute</div>
</body>

</html>
