<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Control Statements</title>
</head>
<body>
  <h1>Loop Control Statements</h1>
  <button onclick="printNumbers()">Print Numbers</button>
  <p id="result"></p>

  <script>
    function printNumbers() {
      let result = "";
      for (let i = 1; i <= 10; i++) {
        if (i === 5) {
          continue; // skip 5
        }
        if (i === 8) {
          break; // stop at 8
        }
        result += i + " ";
      }
      document.getElementById("result").innerHTML = result;
    }
  </script>
</body>
</html>
